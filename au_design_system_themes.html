
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:1.5rem 0}
.header{margin-bottom:1.5rem}
.header h2{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.header p{font-size:13px;color:var(--color-text-secondary)}
.themes-grid{display:flex;flex-direction:column;gap:1.5rem}
.theme-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.theme-meta{padding:12px 16px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;justify-content:space-between;align-items:center}
.theme-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.theme-label{font-size:11px;color:var(--color-text-secondary);font-family:var(--font-mono)}
.swatches{display:flex;height:56px}
.swatch{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.swatch span{font-size:9px;font-weight:500;opacity:0;transition:opacity .15s;white-space:nowrap}
.swatch:hover span{opacity:1}
.stop-label{font-size:9px;color:var(--color-text-tertiary);padding:4px 16px 8px;display:flex;gap:0;background:var(--color-background-secondary)}
.stop-label div{flex:1;text-align:center;font-family:var(--font-mono)}
.preview-row{display:flex;gap:10px;padding:12px 16px;align-items:center;flex-wrap:wrap;border-top:0.5px solid var(--color-border-tertiary)}
.btn-prev{height:28px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:500;border:none;cursor:pointer;display:flex;align-items:center;gap:6px}
.badge-prev{height:20px;padding:0 8px;border-radius:10px;font-size:10px;font-weight:500;display:flex;align-items:center}
.tag-prev{height:22px;padding:0 8px;border-radius:4px;font-size:10px;font-weight:500;display:flex;align-items:center;border:1px solid}
.chip-prev{height:22px;padding:0 8px;border-radius:11px;font-size:10px;font-weight:500;display:flex;align-items:center}
.progress-prev{width:80px;height:5px;border-radius:3px;overflow:hidden;background:#E5E7EB;flex-shrink:0}
.progress-fill{height:100%;border-radius:3px;width:65%}
</style>

<div class="wrap">
<div class="header">
  <h2>AU Design System — Redesigned Theme Palettes</h2>
  <p>15 premium themes for Fintech & SaaS. Hover swatches to see hex values.</p>
</div>

<div class="themes-grid" id="themesGrid"></div>
</div>

  }

const stopNames = ['50','100','150','200','250','300','350','400','450'];

const grid = document.getElementById('themesGrid');

themes.forEach(t => {
  const card = document.createElement('div');
  card.className = 'theme-card';

  const swatchHTML = t.stops.map((hex,i) => {
    const isLight = parseInt(hex.replace('#',''),16) > 0xAAAAAA;
    const txtColor = isLight ? '#1a1a1a' : '#ffffff';
    return `<div class="swatch" style="background:${hex}"><span style="color:${txtColor}">${hex}</span></div>`;
  }).join('');

  const stopLabelHTML = stopNames.map(s => `<div>${s}</div>`).join('');

  const base = t.stops[4];
  const shade1 = t.stops[5];
  const tint2 = t.stops[1];
  const shade3 = t.stops[6];

  card.innerHTML = `
    <div class="theme-meta">
      <span class="theme-name">${t.id.toUpperCase()} — ${t.name}</span>
      <span class="theme-label">${t.label}</span>
    </div>
    <div class="swatches">${swatchHTML}</div>
    <div class="stop-label">${stopLabelHTML}</div>
    <div class="preview-row">
      <button class="btn-prev" style="background:${t.btn[0]};color:${t.btn[1]}">
        <i class="ti ti-check" aria-hidden="true" style="font-size:12px"></i>Primary
      </button>
      <button class="btn-prev" style="background:${tint2};color:${shade3};border:1px solid ${t.stops[2]}">Outline</button>
      <span class="badge-prev" style="background:${t.badge[0]};color:${t.badge[1]}">${t.name}</span>
      <span class="tag-prev" style="background:transparent;color:${shade1};border-color:${t.stops[2]}">${t.id.toUpperCase()}</span>
      <div class="progress-prev"><div class="progress-fill" style="background:${base}"></div></div>
      <span style="font-size:11px;color:var(--color-text-secondary);margin-left:auto">primary-base: ${base}</span>
    </div>
  `;
  grid.appendChild(card);
});
</script>
